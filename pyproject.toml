[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webcamcctv"
version = "0.3.0"
description = "Local-first webcam CCTV service and desktop monitor"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["opencv-python>=4.9", "numpy>=1.26", "platformdirs>=4.2", "PySide6>=6.7", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=7", "ruff>=0.5", "mypy>=1.10", "types-psutil>=7.0", "pyinstaller>=6.8"]
secure = ["keyring>=25", "cryptography>=43"]
ai = ["onnxruntime>=1.18"]
audio = ["sounddevice>=0.5", "av>=12"]

[project.scripts]
webcamcctv = "webcamcctv.cli:main"
webcamcctv-service = "webcamcctv.service:main"
webcamcctv-gui = "webcamcctv.gui:main"
webcamcctv-startup = "webcamcctv.startup:main"

[tool.hatch.build.targets.wheel]
packages = ["src/webcamcctv"]
[tool.pytest.ini_options]
pythonpath = ["src"]
[tool.ruff]
line-length = 100
extend-exclude = [".agents", ".claude", ".codex"]
[tool.mypy]
strict = true

[tool.hatch.build]
include = ["src/webcamcctv/**/*.py", "src/webcamcctv/locales/*.json"]
